name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.8
      - run: ruff check src trainers experiments tests
      - run: ruff format --check src trainers experiments tests
      - run: python -m compileall -q src trainers experiments tests
